# cninfo 下载参数
download:
  delay_seconds: 1.5          # 请求间隔
  retries: 3                  # 指数退避重试次数
  timeout: 60
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
  annual_report_category: "category_ndbg_szsh;"

# 质检阈值
qc:
  gate2_hit_rate_target: 0.85   # 答案文本命中率目标（空页码条不计入分母）
  gate4_section2_target: 0.90   # 第二节核心12指标提取率目标
  gate4_stmt_target: 0.85       # 三大报表核心行提取率目标
  cross_tolerance: 0.005        # 交叉校验相对误差容差 0.5%
