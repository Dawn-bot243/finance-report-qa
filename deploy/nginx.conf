worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    log_format main '$remote_addr - $request_time "$request" $status '
                    'upstream=$upstream_addr ua="$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ---- 限流（按客户端 IP）----
    # API：Agent/辩论单次可能跑 10–60 秒，限制并发新建速率即可
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=5r/s;
    # 页面/静态资源/WebSocket 握手
    limit_req_zone $binary_remote_addr zone=web_zone:10m rate=20r/s;
    limit_req_status 429;

    upstream backend  { server backend:8000;  keepalive 32; }
    upstream frontend { server frontend:8501; keepalive 32; }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        # ---- API（FastAPI）----
        location /api/ {
            limit_req zone=api_zone burst=10 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Agent 多轮工具调用 / 辩论可能持续数分钟
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }

        # ---- 前端（Streamlit，含 WebSocket）----
        location / {
            limit_req zone=web_zone burst=40 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }
    }
}
